name: CI

on:
  push:
    branches: [main]
    tags: ["playtest-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1-stable
  GODOT_DIR: /opt/godot

jobs:
  tests:
    name: Import + GUT tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GODOT_DIR"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-extracted
          mv /tmp/godot-extracted/Godot_v${GODOT_VERSION}_linux.x86_64 "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      # Первый headless-запуск импортирует ассеты и создаёт .godot/;
      # движок нередко возвращает ненулевой код после --quit даже при
      # успешном импорте, поэтому падение здесь не должно останавливать job —
      # реальная проверка корректности происходит на шаге с тестами.
      - name: Import project (warm .godot/ cache)
        run: |
          "$GODOT_DIR/godot" --headless --editor --quit --path . || true

      - name: Run GUT tests
        run: |
          "$GODOT_DIR/godot" --headless --path . \
            -s addons/gut/gut_cmdln.gd \
            -gexit \
            -gjunit_xml_file=res://gut_results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-test-results
          path: gut_results.xml

      # ARC-071: обязательная проверка на main упала — шлём уведомление в Telegram,
      # чтобы не нужно было заходить во вкладку Actions. Тихо пропускается, если
      # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID ещё не заведены в Settings -> Secrets.
      - name: Уведомить в Telegram о падении CI на main
        if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID не заданы в Secrets — пропускаю уведомление."
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TEXT="❌ CI упал на main (джоб tests), commit ${SHORT_SHA}"$'\n'"${RUN_URL}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}"

  export-web:
    name: Build Web export
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GODOT_DIR"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-extracted
          mv /tmp/godot-extracted/Godot_v${GODOT_VERSION}_linux.x86_64 "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      # Каталог версии шаблонов экспорта, который ожидает Godot, — это версия с точками
      # вместо дефиса перед статусом релиза (4.7.1-stable -> 4.7.1.stable).
      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          TEMPLATE_DIR="${GODOT_VERSION/-/.}"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates-extracted
          mv /tmp/templates-extracted/templates "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}"

      - name: Import project (warm .godot/ cache)
        run: |
          "$GODOT_DIR/godot" --headless --editor --quit --path . || true

      # ARC-069: версия сборки для BuildVersion (core/build_version.gd), читается
      # рантаймом из res://build_version.json и показывается в главном меню.
      - name: Записать build_version.json
        run: |
          VERSION=$(git describe --tags --always --dirty --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > build_version.json << EOF
          {
            "version": "$VERSION",
            "commit": "$COMMIT",
            "built_at": "$BUILT_AT"
          }
          EOF
          cat build_version.json

      - name: Export Web build
        run: |
          mkdir -p web
          "$GODOT_DIR/godot" --headless --path . --export-release "Web" ./web/index.html

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/
          retention-days: 30

  # ARC-075: юнит-тесты (джоб tests) проверяют только логику внутри Godot и не
  # ловят падения, специфичные для WASM/браузерного окружения. Открываем реальный
  # экспортированный бандл в headless Chromium и валим джоб на JS/WASM-ошибках
  # в консоли — на каждый push/PR, как и остальные обязательные проверки.
  smoke-test-web:
    name: Smoke-тест Web-сборки (headless Chromium)
    runs-on: ubuntu-latest
    needs: export-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Скачать артефакт Web-сборки
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Установить Playwright + Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Запустить smoke-тест
        run: node tools/web_smoke_test.mjs web 8060

      - name: Приложить скриншот (для диагностики при падении)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-screenshot
          path: web-smoke-screenshot.png
          if-no-files-found: ignore
          retention-days: 14

  # ARC-070: последняя Web-сборка с main доступна по прямой ссылке (GitHub Pages),
  # без скачивания артефакта и без локальной сборки в Godot — можно открыть с телефона.
  deploy-web-pages:
    name: Опубликовать Web-сборку на GitHub Pages
    runs-on: ubuntu-latest
    needs: export-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Скачать артефакт Web-сборки
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/

      - name: Упаковать артефакт для Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Задеплоить на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ARC-071: новая играбельная сборка готова — уведомляем, чтобы не проверять
      # вручную. Шаг просто не выполнится, если деплой выше упал (см. ARC-071).
      - name: Уведомить в Telegram о готовой Web-сборке
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID не заданы в Secrets — пропускаю уведомление."
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TEXT="✅ Новая Web-сборка готова (commit ${SHORT_SHA})"$'\n'"https://naraks.github.io/arcomage-alfa/"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}"

  build-windows-playtest:
    name: Build Windows playtest
    runs-on: ubuntu-latest
    needs: tests
    # Только по тегу playtest-YYYYMMDD или вручную из вкладки Actions — не на каждый push/PR
    # (см. ARC-068). godotengine/godot экспортирует Windows-бинарник кросс-компиляцией даже
    # с ubuntu-latest, отдельного Windows-раннера не нужно.
    if: startsWith(github.ref, 'refs/tags/playtest-') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GODOT_DIR"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-extracted
          mv /tmp/godot-extracted/Godot_v${GODOT_VERSION}_linux.x86_64 "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          TEMPLATE_DIR="${GODOT_VERSION/-/.}"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates-extracted
          mv /tmp/templates-extracted/templates "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR}"

      - name: Import project (warm .godot/ cache)
        run: |
          "$GODOT_DIR/godot" --headless --editor --quit --path . || true

      # ARC-069: версия сборки для BuildVersion (core/build_version.gd), читается
      # рантаймом из res://build_version.json и показывается в главном меню.
      - name: Записать build_version.json
        run: |
          VERSION=$(git describe --tags --always --dirty --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > build_version.json << EOF
          {
            "version": "$VERSION",
            "commit": "$COMMIT",
            "built_at": "$BUILT_AT"
          }
          EOF
          cat build_version.json

      - name: Export Windows build
        run: |
          mkdir -p builds/alfa-windows
          "$GODOT_DIR/godot" --headless --path . --export-release "Windows Desktop" ./builds/alfa-windows/Alfa.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: alfa-windows-playtest
          path: builds/alfa-windows/
          retention-days: 30
