:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-destructive {

}

  const removeList = root.querySelector(&#x27;#arc-remove-list&#x27;);
  const variantButtons = root.querySelector(&#x27;#arc-variant-buttons&#x27;);
  const variantNote = root.querySelector(&#x27;#arc-variant-note&#x27;);
  const mock = root.querySelector(&#x27;#arc-mock&#x27;);
  const tradeoff = root.querySelector(&#x27;#arc-tradeoff&#x27;);

  function esc(value) {
    return String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, ch =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[ch]));
  }

  function listHtml(items) { return items.map(item =&gt; `&lt;li&gt;${esc(item)}&lt;/li&gt;`).join(&#x27;&#x27;); }

  function frame(inner, header, footer) {
    return `&lt;div class=&quot;arc-game-frame&quot;&gt;&lt;div class=&quot;arc-game-top&quot;&gt;&lt;span class=&quot;arc-game-title&quot;&gt;${esc(header)}&lt;/span&gt;&lt;span class=&quot;arc-chip&quot;&gt;UX-концепт&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;arc-stage&quot;&gt;${inner}&lt;/div&gt;&lt;div class=&quot;arc-game-foot&quot;&gt;&lt;span&gt;${esc(footer || &#x27;Контекст всегда виден&#x27;)}&lt;/span&gt;&lt;button type=&quot;button&quot; class=&quot;arc-game-action arc-game-action--main&quot;&gt;Продолжить&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
  }

  function renderMock(screen, variant) {
    const z = variant.zones;
    if (variant.layout === &#x27;hero&#x27;) {
      return `&lt;div class=&quot;arc-game-frame&quot;&gt;&lt;div class=&quot;arc-hero-art&quot;&gt;&lt;/div&gt;&lt;div class=&quot;arc-tower arc-tower--left&quot;&gt;&lt;/div&gt;&lt;div class=&quot;arc-tower arc-tower--right&quot;&gt;&lt;/div&gt;&lt;div class=&quot;arc-hero-copy&quot;&gt;&lt;div class=&quot;arc-logo&quot;&gt;${esc(z[0])}&lt;/div&gt;&lt;div class=&quot;arc-menu-stack&quot;&gt;${z.slice(1).map((x,i)=&gt;`&lt;div class=&quot;arc-menu-item&quot;&gt;${i===0?&#x27;◆ &#x27;:&#x27;&#x27;}${esc(x)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
    }
    if (variant.layout === &#x27;path&#x27;) {
      return frame(`&lt;div class=&quot;arc-path&quot;&gt;${z.slice(1).map(x=&gt;`&lt;div class=&quot;arc-node&quot;&gt;${esc(x)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`, z[0], &#x27;Колода 18 · Артефакты 3&#x27;);
    }
    if (variant.layout === &#x27;arena&#x27;) {
      return `&lt;div class=&quot;arc-game-frame&quot;&gt;&lt;div class=&quot;arc-stage&quot; style=&quot;inset:10px 0 112px&quot;&gt;&lt;div class=&quot;arc-arena&quot;&gt;&lt;div class=&quot;arc-va-side&quot;&gt;&lt;div class=&quot;arc-va-hud&quot;&gt;&lt;strong&gt;${esc(z[0])}&lt;/strong&gt;&lt;div class=&quot;arc-resources&quot;&gt;🧱12(+2) 💎7(+1) 🐾4(+2)&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;arc-fortress arc-fortress--enemy&quot;&gt;&lt;div class=&quot;arc-building arc-building--tower&quot;&gt;&lt;span class=&quot;arc-building-value&quot;&gt;Башня 31&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;arc-building arc-building--wall&quot;&gt;&lt;span class=&quot;arc-building-value&quot;&gt;Стена 8&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;arc-turn&quot;&gt;${esc(z[1])} · Огненный шар → Башня −6&lt;/div&gt;&lt;div class=&quot;arc-va-side arc-va-side--player&quot;&gt;&lt;div class=&quot;arc-fortress arc-fortress--player&quot;&gt;&lt;div class=&quot;arc-building arc-building--wall&quot;&gt;&lt;span class=&quot;arc-building-value&quot;&gt;Стена 12&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;arc-building arc-building--tower is-short&quot;&gt;&lt;span class=&quot;arc-building-value&quot;&gt;Башня 25&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;arc-va-hud&quot;&gt;&lt;strong&gt;${esc(z[2])}&lt;/strong&gt;&lt;div class=&quot;arc-resources&quot;&gt;🧱9(+2) 💎5(+1) 🐾6(+2)&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;arc-game-foot&quot; style=&quot;min-height:112px&quot;&gt;&lt;div&gt;&lt;div class=&quot;arc-hand&quot;&gt;${[&#x27;Стена&#x27;,&#x27;Архимаг&#x27;,&#x27;Дракон&#x27;,&#x27;Бастион&#x27;,&#x27;Гоблин&#x27;].map(x=&gt;`&lt;span&gt;${x}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;text-small&quot; style=&quot;margin-top:6px&quot;&gt;${esc(z[3])}&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;arc-game-action arc-game-action--main&quot;&gt;${esc(z[4])}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
    }
    if (variant.layout === &#x27;cards&#x27;) {
      return frame(`&lt;div class=&quot;arc-cards&quot;&gt;${z.slice(0,3).map((x,i)=&gt;`&lt;div class=&quot;arc-card-mini&quot;&gt;&lt;strong&gt;${esc(x)}&lt;/strong&gt;&lt;div class=&quot;arc-card-art&quot;&gt;&lt;/div&gt;&lt;span&gt;${i===2?&#x27;Редкая награда&#x27;:&#x27;Эффект и стоимость&#x27;}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`, screen.name, `${z[3] || &#x27;&#x27;} · ${z[4] || &#x27;&#x27;}`);
    }
    if (variant.layout === &#x27;story&#x27; || variant.layout === &#x27;choices&#x27;) {
      return frame(`&lt;div class=&quot;arc-story&quot;&gt;&lt;div class=&quot;arc-story-art&quot;&gt;&lt;/div&gt;&lt;div class=&quot;arc-choice-stack&quot;&gt;&lt;h3&gt;${esc(z[0])}&lt;/h3&gt;${z.slice(1,4).map((x,i)=&gt;`&lt;div class=&quot;arc-choice&quot;&gt;&lt;strong&gt;${esc(x)}&lt;/strong&gt;&lt;em&gt;${i===0?&#x27;Гарантированный эффект&#x27;:&#x27;Решение игрока&#x27;}&lt;/em&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`, screen.name, z[4]);
    }
    if (variant.layout === &#x27;summary&#x27;) {
      return frame(`&lt;div class=&quot;arc-summary&quot;&gt;&lt;div class=&quot;arc-score&quot;&gt;&lt;span&gt;${esc(z[0])}&lt;/span&gt;&lt;strong&gt;${esc(z[1])}&lt;/strong&gt;&lt;span&gt;Новый личный результат&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;arc-timeline&quot;&gt;${z.slice(2).map(x=&gt;`&lt;div&gt;${esc(x)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`, screen.name, &#x27;Поделиться · Новый забег&#x27;);
    }
    if (variant.layout === &#x27;profile&#x27;) {
      return frame(`&lt;div class=&quot;arc-profile&quot;&gt;&lt;div class=&quot;arc-profile-nav&quot;&gt;${z.slice(1,4).map((x,i)=&gt;`&lt;div class=&quot;${i===0?&#x27;is-active&#x27;:&#x27;&#x27;}&quot;&gt;${esc(x)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;arc-profile-main&quot;&gt;&lt;h3&gt;${esc(z[0])}&lt;/h3&gt;&lt;div class=&quot;arc-upgrade-grid&quot;&gt;${[&#x27;Башня +5&#x27;,&#x27;Карьер +1&#x27;,&#x27;Редкая карта&#x27;,&#x27;Рука +1&#x27;].map((x,i)=&gt;`&lt;div class=&quot;arc-upgrade&quot;&gt;&lt;strong&gt;${x}&lt;/strong&gt;&lt;div class=&quot;text-small&quot;&gt;${i&lt;2?&#x27;ур. 2/5 · 200 ✦&#x27;:&#x27;следующая цель&#x27;}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`, screen.name, z[4]);
    }
    if (variant.layout === &#x27;mobile&#x27;) {
      return `&lt;div class=&quot;arc-game-frame&quot;&gt;&lt;div class=&quot;arc-phone-wrap&quot;&gt;&lt;div class=&quot;arc-phone&quot;&gt;&lt;div class=&quot;arc-phone-head&quot;&gt;${esc(z[0])}&lt;/div&gt;&lt;div class=&quot;arc-phone-body&quot;&gt;${z.slice(1,4).map(x=&gt;`&lt;div class=&quot;arc-phone-item&quot;&gt;${esc(x)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;arc-phone-tabs&quot;&gt;${esc(z[4])}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
    }
    return frame(`&lt;div class=&quot;arc-split&quot;&gt;&lt;div class=&quot;arc-pane&quot;&gt;&lt;h3&gt;${esc(z[0])}&lt;/h3&gt;${z.slice(1,3).map(x=&gt;`&lt;div class=&quot;arc-row&quot;&gt;&lt;span&gt;${esc(x)}&lt;/span&gt;&lt;span&gt;›&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;arc-pane&quot;&gt;&lt;h3&gt;${esc(z[3] || &#x27;Детали&#x27;)}&lt;/h3&gt;&lt;div class=&quot;arc-row&quot;&gt;&lt;span&gt;${esc(z[4] || &#x27;Выбранное действие&#x27;)}&lt;/span&gt;&lt;span&gt;✓&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;arc-row&quot;&gt;&lt;span&gt;Контекст и последствия&lt;/span&gt;&lt;span&gt;i&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`, screen.name, &#x27;Назад · Сохранено&#x27;);
  }

  function render() {
    const screen = screens[screenIndex];
    const variant = screen.variants[variantIndex];
    select.value = String(screenIndex);
    title.textContent = screen.name;
    meta.innerHTML = `&lt;span class=&quot;arc-tag&quot;&gt;&lt;span class=&quot;arc-dot&quot;&gt;&lt;/span&gt;${esc(screen.priority)}&lt;/span&gt;&lt;span&gt;${esc(screen.source)}&lt;/span&gt;&lt;span&gt;${screenIndex + 1} / ${screens.length}&lt;/span&gt;`;
    current.textContent = screen.current;
    addList.innerHTML = listHtml(screen.add);
    removeList.innerHTML = listHtml(screen.remove);
    variantButtons.innerHTML = screen.variants.map((item, index) =&gt; `&lt;button type=&quot;button&quot; class=&quot;btn ${item.rec?&#x27;btn-primary&#x27;:&#x27;&#x27;}&quot; data-variant=&quot;${index}&quot; aria-pressed=&quot;${index===variantIndex}&quot;&gt;${item.rec?&#x27;★ &#x27;:&#x27;&#x27;}${esc(item.name)}&lt;/button&gt;`).join(&#x27;&#x27;);
    variantNote.innerHTML = `${variant.rec?&#x27;&lt;span class=&quot;arc-rec&quot;&gt;Рекомендовано · &lt;/span&gt;&#x27;:&#x27;&#x27;}${esc(variant.thesis)}`;
    mock.innerHTML = renderMock(screen, variant);
    tradeoff.textContent = `Компромисс: ${variant.tradeoff}`;
    variantButtons.querySelectorAll(&#x27;button&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
      variantIndex = Number(button.dataset.variant);
      render();
    }));
  }

  screens.forEach((screen, index) =&gt; {
    const option = document.createElement(&#x27;option&#x27;);
    option.value = String(index);
    option.textContent = `${index + 1}. ${screen.name}`;
    select.appendChild(option);
  });
  select.addEventListener(&#x27;change&#x27;, () =&gt; { screenIndex = Number(select.value); variantIndex = 0; render(); });
  root.querySelector(&#x27;#arc-prev&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { screenIndex = (screenIndex - 1 + screens.length) % screens.length; variantIndex = 0; render(); });
  root.querySelector(&#x27;#arc-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { screenIndex = (screenIndex + 1) % screens.length; variantIndex = 0; render(); });
  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
